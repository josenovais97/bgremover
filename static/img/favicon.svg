<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <clipPath id="t"><rect width="64" height="64" rx="15"/></clipPath>
    <!-- The far peak is cut back along the near peak's silhouette, leaving a 2px
         gradient gap. The old mark let the two overlap at 0.85 opacity, which at
         32px was one grey wedge rather than two hills. -->
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M14 49 L30 23 L46 49 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- Photo glyph on the brand gradient tile: sun, near peak, far peak.
       Same three shapes as before, re-cut so they survive small sizes —
       the sun cleared the near apex by 2px and the far peak barely emerged
       from behind it, so at 32px the mark was a blob and a dot.
       The glyph spans 7-58 across and 13-50 down: centred in the tile. -->
  <g clip-path="url(#t)">
    <rect width="64" height="64" fill="url(#g)"/>
    <circle cx="13" cy="19" r="5.8" fill="#ffffff"/>
    <path d="M36 49 L46 30 L57 49 Z" fill="#ffffff" mask="url(#cut)"
          stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 49 L30 23 L46 49 Z" fill="#ffffff"
          stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
