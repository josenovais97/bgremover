<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M14 49 L30 23 L46 49 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- Maskable: the tile bleeds to the edge (the launcher supplies the shape) and
       the glyph is scaled to 0.72 about the centre so it stays inside the 80%
       safe circle whatever mask Android applies. Same artwork as favicon.svg. -->
  <rect width="64" height="64" fill="url(#g)"/>
  <g transform="translate(32,32) scale(0.72) translate(-32,-32)">
    <circle cx="13" cy="19" r="5.8" fill="#ffffff"/>
    <path d="M36 49 L46 30 L57 49 Z" fill="#ffffff" mask="url(#cut)"
          stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 49 L30 23 L46 49 Z" fill="#ffffff"
          stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
